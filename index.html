<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ein Memory-Spiel für zwei Spielerinnen oder Spieler." />
    <title>Memory – Ready to play?</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="app" class="app">
      <section id="home-screen" class="screen home" aria-labelledby="home-title">
        <div class="home__content">
          <p class="home__eyebrow">It’s play time.</p>
          <h1 id="home-title" class="home__title">Ready to play?</h1>
          <button id="play-button" class="play-button" type="button">
            <svg class="play-button__icon" aria-hidden="true"><use href="/assets/icons.svg#controller"></use></svg>
            <span>Play</span>
            <span class="play-button__arrow" aria-hidden="true">→</span>
          </button>
        </div>
        <svg class="home__controller" aria-hidden="true"><use href="/assets/icons.svg#controller"></use></svg>
      </section>
      <section id="settings-screen" class="screen settings" aria-labelledby="settings-title" hidden>
        <div class="settings__inner">
          <header class="settings__header">
            <button id="back-button" class="back-button" type="button" aria-label="Zurück zum Homescreen">←</button>
            <h2 id="settings-title">Settings</h2>
          </header>

          <form id="settings-form" class="settings-form">
            <div class="settings-form__options">
              <fieldset class="option-group">
                <legend><svg aria-hidden="true"><use href="/assets/icons.svg#palette"></use></svg>Game themes</legend>
                <label><input type="radio" name="theme" value="code-vibes" /> Code vibes</label>
                <label><input type="radio" name="theme" value="gaming" /> Gaming</label>
                <label><input type="radio" name="theme" value="da-projects" checked /> DA Projects</label>
                <label><input type="radio" name="theme" value="food" /> Food</label>
              </fieldset>

              <fieldset class="option-group">
                <legend><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg>Choose player</legend>
                <label><input type="radio" name="player" value="blue" checked /> Blue</label>
                <label><input type="radio" name="player" value="orange" /> Orange</label>
              </fieldset>

              <fieldset class="option-group">
                <legend><svg aria-hidden="true"><use href="/assets/icons.svg#cards"></use></svg>Board size</legend>
                <label><input type="radio" name="boardSize" value="4x4" checked /> 16 cards</label>
                <label><input type="radio" name="boardSize" value="4x6" /> 24 cards</label>
                <label><input type="radio" name="boardSize" value="6x6" /> 36 cards</label>
              </fieldset>

              <fieldset class="option-group">
                <legend><svg aria-hidden="true"><use href="/assets/icons.svg#layout"></use></svg>Layout</legend>
                <label><input type="radio" name="layout" value="light" checked /> Light</label>
                <label><input type="radio" name="layout" value="dark" /> Dark</label>
              </fieldset>
            </div>

            <aside id="settings-preview" class="settings-preview" data-layout="light" data-theme="da-projects" aria-label="Vorschau der gewählten Einstellungen">
              <div class="settings-preview__status">
                <span class="score score--orange"><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg> 0</span>
                <span class="score score--blue"><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg> 0</span>
                <span>Current player: <strong id="preview-player" class="preview-player preview-player--blue"><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg></strong></span>
                <span><svg aria-hidden="true"><use href="/assets/icons.svg#exit"></use></svg> Exit game</span>
              </div>
              <div class="settings-preview__cards" aria-hidden="true">
                <span class="preview-card preview-card--back"><svg aria-hidden="true"><use href="/assets/icons.svg#laptop"></use></svg></span>
                <span id="preview-motif" class="preview-card preview-card--front"><img src="/assets/cards/da-projects/wave.png" alt="Welle" /></span>
              </div>
            </aside>

            <div class="settings-form__actions">
              <span>Game theme</span><span class="settings-form__separator" aria-hidden="true"></span>
              <span>Player</span><span class="settings-form__separator" aria-hidden="true"></span>
              <span>Board size</span><span class="settings-form__separator" aria-hidden="true"></span>
              <span>Layout</span>
              <button class="start-button" type="submit"><svg aria-hidden="true"><use href="/assets/icons.svg#start"></use></svg> Start</button>
            </div>
            <p id="settings-feedback" class="settings-form__feedback" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section id="game-screen" class="screen game" aria-labelledby="game-title" hidden>
        <h2 id="game-title" class="visually-hidden">Memory-Spielfeld</h2>
        <header class="game-status">
          <div class="game-status__scores">
            <span class="score score--orange"><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg><span class="score__name">Orange </span><strong id="orange-score">0</strong></span>
            <span class="score score--blue"><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg><span class="score__name">Blue </span><strong id="blue-score">0</strong></span>
          </div>
          <p>Current player: <strong id="current-player"><svg aria-hidden="true"><use href="/assets/icons.svg#pawn"></use></svg><span class="visually-hidden">Blue</span></strong></p>
          <button id="exit-button" class="exit-button" type="button"><svg aria-hidden="true"><use href="/assets/icons.svg#exit"></use></svg> Exit game</button>
        </header>
        <div id="game-board" class="game-board" aria-label="Memory-Karten"></div>

        <section id="result-overlay" class="result-overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
          <div class="result-card">
            <p class="result-card__eyebrow">Game over</p>
            <h2 id="result-title">Well played!</h2>
            <p id="result-message" class="result-card__message"></p>
            <div class="result-card__scores">
              <span class="score score--orange">Orange: <strong id="final-orange-score">0</strong></span>
              <span class="score score--blue">Blue: <strong id="final-blue-score">0</strong></span>
            </div>
            <div class="result-card__actions">
              <button id="new-round-button" class="start-button" type="button">Neue Runde</button>
              <button id="result-home-button" class="text-button" type="button">Zum Start</button>
            </div>
          </div>
        </section>
      </section>
    </main>
    <!-- Kartenstruktur; TypeScript ergänzt nur Motiv und Karten-ID. -->
    <template id="card-template">
      <button class="memory-card" type="button" aria-label="Verdeckte Memory-Karte">
        <span class="memory-card__inner" aria-hidden="true">
          <span class="memory-card__back"><svg aria-hidden="true"><use href="/assets/icons.svg#laptop"></use></svg></span>
          <span class="memory-card__front"></span>
        </span>
      </button>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
